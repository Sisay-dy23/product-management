<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <h2>Product Manager</h2>

        <div>

            <a href="index.html">Dashboard</a>

            <a href="product.html">Products</a>

            <a href="search.html">Search</a>

        </div>

    </nav>


    <main>

        <h1>Dashboard<span class="flourish">today's tally</span></h1>

        <hr class="page-rule">


        <div class="dashboard">


            <div class="card">

                <h2>Total Products</h2>

                <p id="totalproducts">0</p>

            </div>


            <div class="card">

                <h2>Total Stock</h2>

                <p id="totalstock">0</p>

            </div>


            <div class="card">

                <h2>Total Value</h2>

                <p id="totalvalue">0 ETB</p>

            </div>


            <div class="card">

                <h2>Low Stock</h2>

                <p id="lowstock">0</p>

            </div>


        </div>


        <section>

            <h2>Welcome</h2>

            <p>
                Use the product page to add, edit and delete products.
            </p>

            <p>
                Use the search page to find products quickly.
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
